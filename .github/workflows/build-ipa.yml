name: Build IPA

# Push a tag like v1.0 → builds an unsigned FilmVibe.ipa and attaches it to a GitHub Release.
# "Run workflow" on the Actions tab → builds one without releasing (grab it from the run's artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build unsigned IPA
        run: filmvibe/scripts/build-ipa.sh

      - uses: actions/upload-artifact@v6
        with:
          name: FilmVibe
          path: filmvibe/build/FilmVibe.ipa

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" filmvibe/build/FilmVibe.ipa --title "FilmVibe $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" filmvibe/build/FilmVibe.ipa --clobber
